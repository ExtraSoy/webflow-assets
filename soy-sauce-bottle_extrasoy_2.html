const mm = (v) => v / 1000;
const V2 = (r, h) => new THREE.Vector2(mm(r), mm(h));

/* ---------- Silhouette ---------- */
const outerCtl = [
  [31.0, 4], [32.6, 13], [33.1, 22], [32.7, 31], [31.7, 40],
  [30.2, 50], [27.9, 60], [24.8, 70], [21.2, 79], [17.9, 87],
  [15.2, 93], [13.0, 98], [11.6, 103], [10.9, 107],
  [10.7, 110], [10.8, 114], [10.9, 116.5], [11.0, 118.5],
];
const outer = new THREE.SplineCurve(outerCtl.map(([r, h]) => new THREE.Vector2(r, h)))
  .getPoints(170).map((p) => [p.x, p.y]);

const at = (h) => {
  if (h <= outer[0][1]) return outer[0][0];
  if (h >= outer[outer.length - 1][1]) return outer[outer.length - 1][0];
  for (let i = 1; i < outer.length; i++) {
    if (outer[i][1] >= h) {
      const [r0, h0] = outer[i - 1], [r1, h1] = outer[i];
      return r0 + (r1 - r0) * ((h - h0) / (h1 - h0));
    }
  }
  return outer[outer.length - 1][0];
};
const wallAt = (h) => (h >= 100 ? 3.0 : h <= 20 ? 4.4 : 4.4 - ((h - 20) / 80) * 1.4);
const innerR = (h) => Math.max(0.4, at(h) - wallAt(h));

const FILL = 99;      // Fuellhoehe
const FLOOR = 3.4;    // Innenboden

/* ---------- Glas: eine geschlossene Aussenhaut ----------
   Bewusst KEINE modellierte Innenwand. Jede zusaetzliche brechende Flaeche
   traegt in three.js noch einmal den Hintergrund bei; vier gestapelte Waende
   summieren sich zu einem hellen, flachen Schleier statt durchsichtig zu
   wirken. Das Volumen der Wand uebernimmt stattdessen `thickness`.      */
const glassProfile = [V2(0, 0)];
for (const [r, h] of outer) glassProfile.push(V2(r, h));
glassProfile.push(V2(11.5, 119.2), V2(11.55, 119.9), V2(11.2, 120.35), V2(10.6, 120.5), V2(0, 120.5));

const glassMat = new THREE.MeshPhysicalMaterial({

  color: 0xffffff,
  metalness: 0,
  roughness: 0.105,
  transmission: 1,
  ior: 1.52,
  thickness: mm(3.2),
  /* Absorption muss im Verhaeltnis zur Wandstaerke stehen. Mit einer
     Weglaenge von mehreren Zentimetern passiert bei 3 mm Glas praktisch
     nichts - deshalb liegt sie hier in derselben Groessenordnung.      */
  attenuationColor: new THREE.Color(0x928f85),
  attenuationDistance: mm(2.4),

  envMapIntensity: 0.5,

});
const bottle = new THREE.Mesh(new THREE.LatheGeometry(glassProfile, 128), glassMat);

bottle.renderOrder = 3;

/* ---------- Sauce ----------
   Das Volumen fuellt den Innenraum bis weit ueber die Fuellhoehe hinaus und
   wird von einer WAAGERECHTEN Ebene abgeschnitten. Dadurch bleibt der
   Spiegel immer horizontal, egal wie stark die Flasche geneigt ist.     */
const TOP = 116;
const sauceProfile = [V2(0, FLOOR)];
for (const [r, h] of outer) if (h > FLOOR && h <= TOP) sauceProfile.push(V2(innerR(h), h));
sauceProfile.push(V2(innerR(TOP), TOP), V2(0, TOP));

const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), mm(FILL));

const sauceMat = new THREE.MeshPhysicalMaterial({
  name: 'soy_sauce',
  color: 0x5c2810,
  roughness: 0.32,
  metalness: 0,
  clearcoat: 0.25,
  clearcoatRoughness: 0.35,
  envMapIntensity: 0.7,
  clippingPlanes: [clipPlane],
});
const sauce = new THREE.Mesh(new THREE.LatheGeometry(sauceProfile, 128), sauceMat);
sauce.name = 'soy_sauce';

/* ---------- Deckel ---------- */
const capMat = new THREE.MeshStandardMaterial({
  name: 'cap_violet', color: 0x453857, roughness: 0.32, metalness: 0, envMapIntensity: 1,
});
const capProfile = [
  V2(0, 125.0), V2(9.2, 125.0), V2(10.8, 124.4), V2(11.6, 123.2),
  V2(11.6, 113.2), V2(11.9, 112.4),
  V2(15.2, 112.1), V2(15.3, 113.4), V2(15.2, 114.6),
  V2(15.9, 117.6), V2(16.9, 121.2), V2(18.0, 124.5), V2(18.9, 127.0),
];

/* Die Kante und die Kuppe sind kein Drehkoerper mehr, sondern ein eigenes
   Netz. An den beiden Ausgussstellen tritt die Flaeche nach AUSSEN aus der
   Kappe heraus - eine Schnaupe, keine Delle. Obendrauf laeuft eine flache
   Rinne, damit die Sauce gefuehrt wird.                                 */
const crownProfile = [
  [18.9, 127.0], [19.3, 128.2], [19.3, 128.8], [18.6, 129.3],
  [15.6, 129.6], [8.0, 129.5], [0, 129.4],
];
const NOTCH_AZ = [0, Math.PI];
const NOTCH_OUT = 3.4;                     // wie weit die Schnaupe vorsteht
const NOTCH_DEEP = 1.1;                    // Rinne obenauf
const NOTCH_ANG = 24, NOTCH_TIP = 13;      // Breite aussen / innen

const capTop = [[19.3, 128.8], [18.6, 129.3], [15.6, 129.6], [8.0, 129.5], [0, 129.4]];
function capTopH(r) {
  if (r >= capTop[0][0]) return capTop[0][1];
  for (let i = 1; i < capTop.length; i++) {
    const [r0, h0] = capTop[i - 1], [r1, h1] = capTop[i];
    if (r >= r1) return h0 + (h1 - h0) * ((r - r0) / (r1 - r0));
  }
  return capTop[capTop.length - 1][1];
}
/* Wie weit die Schnaupe an diesem Radius greift. Kein weiches Auslaufen -
   von r = 13.4 an baut sie schnell auf und steht dann voll an, damit sie
   kantig und dick wirkt statt spitz zuzulaufen.                        */
const notchW = (r) => THREE.MathUtils.clamp((r - 13.4) / 3.4, 0, 1);
/* Querschnitt: flache Mitte, steile Flanken - ein Kasten, kein Keil. */
const notchCut = (x) => THREE.MathUtils.clamp((1 - x) / 0.42, 0, 1);

function capCrown() {
  const M = 44, K = 180, seg = [], pts = [];
  let total = 0;
  for (let i = 1; i < crownProfile.length; i++) {
    const [r0, h0] = crownProfile[i - 1], [r1, h1] = crownProfile[i];
    const L = Math.hypot(r1 - r0, h1 - h0);
    seg.push(L); total += L;
  }
  for (let i = 0; i <= M; i++) {
    let d = (i / M) * total, k = 0;
    while (k < seg.length - 1 && d > seg[k]) { d -= seg[k]; k++; }
    const [r0, h0] = crownProfile[k], [r1, h1] = crownProfile[k + 1];
    const f = seg[k] ? Math.min(1, d / seg[k]) : 0;
    pts.push([r0 + (r1 - r0) * f, h0 + (h1 - h0) * f]);
  }
  const pos = [], idx = [];
  for (let j = 0; j <= K; j++) {
    const a = (j / K) * Math.PI * 2;
    for (let i = 0; i <= M; i++) {
      const [r, hh] = pts[i];
      const w = notchW(r);
      /* Am Uebergang zum Drehkoerper bleibt die Flaeche stehen, sonst
         klafft dort eine Naht. */
      const fade = THREE.MathUtils.clamp((hh - 127.0) / 1.2, 0, 1);
      const half = THREE.MathUtils.degToRad(NOTCH_TIP + (NOTCH_ANG - NOTCH_TIP) * w);
      let k = 0;
      for (const na of NOTCH_AZ) {
        const da = Math.abs(((a - na + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
        if (da < half) k = Math.max(k, w * fade * notchCut(da / half));
      }
      const rr = r + NOTCH_OUT * k;      // Schnaupe tritt heraus
      const hhh = hh - NOTCH_DEEP * k;   // Rinne obenauf
      pos.push(Math.cos(a) * mm(rr), mm(hhh), -Math.sin(a) * mm(rr));
    }
  }
  for (let j = 0; j < K; j++) {
    for (let i = 0; i < M; i++) {
      const A = j * (M + 1) + i, B = A + M + 1;
      idx.push(A, B, A + 1, A + 1, B, B + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const cap = new THREE.Group();
cap.name = 'cap';
cap.rotation.y = Math.atan2(1, 1.25);   // Kerben auf der Schauseite
cap.add(new THREE.Mesh(new THREE.LatheGeometry(capProfile, 96), capMat));
const crown = new THREE.Mesh(capCrown(), capMat);
crown.name = 'cap_crown';
cap.add(crown);

/* Die Ausgussloecher sitzen am inneren Ende der Kerben. */
const boreMat = new THREE.MeshStandardMaterial({
  name: 'spout_bore', color: 0x120e1c, roughness: 0.45,
});
const spouts = new THREE.Group();
spouts.rotation.y = cap.rotation.y;
NOTCH_AZ.forEach((na) => {
  const HR = 15.0, kk = notchW(HR);
  const hole = new THREE.Mesh(new THREE.CircleGeometry(mm(1.05), 20), boreMat);
  hole.rotation.x = -Math.PI / 2;
  hole.position.set(
    Math.cos(na) * mm(HR + NOTCH_OUT * kk),
    mm(capTopH(HR) - NOTCH_DEEP * kk + 0.05),
    -Math.sin(na) * mm(HR + NOTCH_OUT * kk));
  hole.renderOrder = 4;
  spouts.add(hole);
});

/* ---------- Etikett ---------- */
function labelTexture(renderer) {
  const [vx, vy, vw, vh] = LABEL_VB;
  const H = 1600, s = H / vh, W = Math.round(vw * s);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.setTransform(s, 0, 0, s, -vx * s, -vy * s);
  for (const p of LABEL_PATHS) {
    const path = new Path2D(p.d);
    if (p.stroke) {
      g.strokeStyle = p.stroke;
      g.lineWidth = p.width || 1;
      g.stroke(path);
    } else {
      g.fillStyle = p.fill;
      g.fill(path);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function decalGeometry(h0, h1, halfWidth, lift = 1.1, segX = 72, segY = 90) {
  const pos = [], uvs = [], idx = [];
  for (let j = 0; j <= segY; j++) {
    const t = j / segY, h = h0 + (h1 - h0) * t, r = at(h) + lift, half = halfWidth / r;
    for (let i = 0; i <= segX; i++) {
      const u = i / segX, a = -half + 2 * half * u;
      pos.push(Math.sin(a) * mm(r), mm(h), Math.cos(a) * mm(r));
      uvs.push(u, t);
    }
  }
  const row = segX + 1;
  for (let j = 0; j < segY; j++) for (let i = 0; i < segX; i++) {
    const v00 = j * row + i, v10 = v00 + 1, v01 = v00 + row, v11 = v01 + 1;
    idx.push(v00, v10, v11, v00, v11, v01);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

/* ---------- Szene ---------- */
const host = document.getElementById('tilt');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 2.0;
/* Alpha 0: die Seite scheint durch. Der Farbwert bleibt gesetzt, weil das
   brechende Glas ihn als Hintergrund liest. */
renderer.setClearColor(new THREE.Color(BG), 0);
renderer.localClippingEnabled = true;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, 1, 0.01, 10);
camera.position.set(0, 0.066, 0.40);
camera.lookAt(0, 0.064, 0);

/* dunkles Studio: kompakte Lichter, dunkler Grund. Damit bleibt das, was
   man durch das Glas sieht, dunkel wie die Seite dahinter.            */
function studio() {
  const W = 1024, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2e2e2b'); g.addColorStop(0.45, '#1d1d1b');
  g.addColorStop(0.55, '#161615'); g.addColorStop(1, '#0b0b0a');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const soft = (cx, cy, rx, ry, peak, mid) => {
    const r = x.createRadialGradient(0, 0, 0, 0, 0, 1);
    r.addColorStop(0, 'rgba(255,255,255,' + peak + ')');
    r.addColorStop(mid, 'rgba(255,255,255,' + peak * 0.28 + ')');
    r.addColorStop(1, 'rgba(255,255,255,0)');
    const blob = (p) => { x.save(); x.translate(p, cy); x.scale(rx, ry); x.fillStyle = r;
      x.beginPath(); x.arc(0, 0, 1, 0, Math.PI * 2); x.fill(); x.restore(); };
    blob(cx); if (cx - rx < 0) blob(cx + W); if (cx + rx > W) blob(cx - W);
  };
  x.globalCompositeOperation = 'lighter';
  soft(W * 0.26, H * 0.20, W * 0.20, H * 0.24, 0.40, 0.45);
  soft(W * 0.74, H * 0.30, W * 0.15, H * 0.18, 0.24, 0.45);
  soft(W * 0.02, H * 0.44, W * 0.10, H * 0.34, 0.28, 0.4);
  soft(W * 0.54, H * 0.44, W * 0.10, H * 0.34, 0.26, 0.4);
  x.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
}
studio();

const key = new THREE.DirectionalLight(0xfff4e6, 1.0);
key.position.set(-0.22, 0.36, 0.28);
const rim = new THREE.DirectionalLight(0xdfe8ff, 1.05);
rim.position.set(0.28, 0.12, -0.34);
scene.add(key, rim, new THREE.AmbientLight(0xffffff, 0.12));

const labelTex = labelTexture(renderer);
const labelMat = new THREE.MeshStandardMaterial({
  name: 'label_cream',
  color: 0xffffff,
  map: labelTex,
  emissiveMap: labelTex,
  emissive: new THREE.Color(0xffffff),
  emissiveIntensity: 0.3,
  transparent: true,
  roughness: 0.82,
  metalness: 0,
  envMapIntensity: 0.55,
});
const LABEL_BOTTOM = 24, LABEL_TOP = 75;
const LABEL_W = (LABEL_TOP - LABEL_BOTTOM) * (LABEL_VB[2] / LABEL_VB[3]);
const labels = new THREE.Group();
labels.rotation.y = Math.atan2(1, 1.25);
['front', 'back'].forEach((side, i) => {
  const m = new THREE.Mesh(decalGeometry(LABEL_BOTTOM, LABEL_TOP, LABEL_W / 2), labelMat);
  m.name = 'label_' + side;
  m.rotation.y = i * Math.PI;
  m.renderOrder = 4;
  labels.add(m);
});

/* ---------- Spiegel der Fluessigkeit ----------
   Der Schnitt einer waagerechten Ebene durch die geneigte Flasche ist eine
   Ellipse, deren Rand der Flaschenkontur folgt. Fuer jeden Winkel wird die
   Hoehe gesucht, an der die Innenwand die Ebene trifft.                  */
const SEG = 160;
const surfGeo = new THREE.BufferGeometry();
const surfPos = new Float32Array((SEG + 2) * 3);
surfGeo.setAttribute('position', new THREE.BufferAttribute(surfPos, 3));
const surfIdx = [];
for (let i = 0; i < SEG; i++) surfIdx.push(0, i + 1, i + 2);
surfGeo.setIndex(surfIdx);

const surfMat = new THREE.MeshPhysicalMaterial({
  name: 'sauce_surface',
  color: 0x5c2810,
  roughness: 0.18,
  metalness: 0,
  clearcoat: 0.5,
  clearcoatRoughness: 0.14,
  envMapIntensity: 0.5,
  side: THREE.DoubleSide,
});
const surface = new THREE.Mesh(surfGeo, surfMat);

/* Die Flasche kippt um ihre Mitte, nicht um den Boden - sonst wandert sie
   beim Neigen aus dem Bild. */
const PIVOT = 64;

function updateSurface(T) {
  const tan = Math.tan(T);
  const Sw = PIVOT + Math.cos(T) * (FILL - PIVOT);   // Spiegelhoehe in Weltkoordinaten (mm)
  surfPos[0] = 0; surfPos[1] = mm(FILL); surfPos[2] = 0;
  for (let i = 0; i <= SEG; i++) {
    const a = (i / SEG) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    let hm = FILL;
    for (let k = 0; k < 6; k++) hm = FILL - tan * innerR(hm) * ca;
    hm = Math.min(TOP - 0.5, Math.max(FLOOR + 0.2, hm));
    const r = innerR(hm), o = (i + 1) * 3;
    surfPos[o] = mm(r * ca); surfPos[o + 1] = mm(hm); surfPos[o + 2] = mm(r * sa);
  }
  surfGeo.attributes.position.needsUpdate = true;
  surfGeo.computeVertexNormals();
  clipPlane.constant = mm(Sw);
}

/* Flasche dreht sich um ihre eigene Achse, die Neigung liegt eine Ebene
   darueber - so bleibt der Spiegel von der Drehung unberuehrt. */
const spin = new THREE.Group();
spin.add(sauce, bottle, cap, spouts, labels);
const model = new THREE.Group();
model.position.y = mm(PIVOT);
spin.position.y = -mm(PIVOT);
surface.position.y = -mm(PIVOT);
model.add(spin, surface);
scene.add(model);

const TILT_BASE = THREE.MathUtils.degToRad(30);
const TILT_HOVER = THREE.MathUtils.degToRad(6);
let tilt = TILT_BASE, tiltTarget = TILT_BASE;
model.rotation.z = tilt;
updateSurface(tilt);

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

let autoSpin = true, dragging = false;
const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (autoSpin && !dragging) spin.rotation.y += dt * 0.55;
  if (Math.abs(tiltTarget - tilt) > 0.0002) {
    tilt += (tiltTarget - tilt) * Math.min(1, dt * 7);
    model.rotation.z = tilt;
    updateSurface(tilt);
  }
  renderer.render(scene, camera);
})();

/* ---------- Hover ---------- */
/* Hover richtet die Flasche auf und haelt die Eigendrehung an, damit man
   sie selbst in der Hand hat. Ziehen dreht um die Achse, hoch/runter kippt.
   Beim Verlassen faehrt alles in die Ausgangslage zurueck.              */
const TILT_MIN = THREE.MathUtils.degToRad(-8);
const TILT_MAX = THREE.MathUtils.degToRad(62);
const stage = document.getElementById('stage');
let px = 0, py = 0;

const grow = () => { host.style.transform = 'scale(1.08)'; tiltTarget = TILT_HOVER; autoSpin = false; };
const shrink = () => {
  host.style.transform = 'scale(1)';
  tiltTarget = TILT_BASE;
  autoSpin = true;
  dragging = false;
  host.classList.remove('dragging');
  hovering = false;
};
/* Nur die Flasche selbst reagiert, nicht die leere Flaeche um sie herum:
   pro Mausbewegung ein Strahl aus der Kamera auf das Modell.           */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hovering = false;

function overBottle(e) {
  const r = renderer.domElement.getBoundingClientRect();
  if (!r.width || !r.height) return false;
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObject(model, true).length > 0;
}

stage.addEventListener('mouseleave', () => { hovering = false; shrink(); });

stage.addEventListener('pointerdown', (e) => {
  if (!overBottle(e)) return;
  dragging = true; px = e.clientX; py = e.clientY;
  host.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!dragging) {
    const over = overBottle(e);
    stage.style.cursor = over ? 'grab' : 'default';
    if (over && !hovering) { hovering = true; grow(); }
    else if (!over && hovering) { hovering = false; shrink(); }
    return;
  }
  spin.rotation.y += (e.clientX - px) * 0.007;
  tiltTarget = Math.min(TILT_MAX, Math.max(TILT_MIN, tiltTarget + (e.clientY - py) * 0.004));
  px = e.clientX; py = e.clientY;
});
const endDrag = (e) => {
  if (!dragging) return;
  dragging = false;
  host.classList.remove('dragging');
  if (e && e.pointerId != null && stage.hasPointerCapture(e.pointerId)) stage.releasePointerCapture(e.pointerId);
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
</script>
