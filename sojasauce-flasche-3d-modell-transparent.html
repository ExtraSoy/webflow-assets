const mm = (v) => v / 1000;
const V2 = (r, h) => new THREE.Vector2(mm(r), mm(h));

/* ---------- Silhouette ---------- */
const outerCtl = [
  [31.0, 4], [32.6, 13], [33.1, 22], [32.7, 31], [31.7, 40],
  [30.2, 50], [27.9, 60], [24.8, 70], [21.2, 79], [17.9, 87],
  [15.2, 93], [13.0, 98], [11.6, 103], [10.9, 108],
  [10.7, 113], [10.8, 120], [10.9, 126], [11.0, 130.5],
];
const outer = new THREE.SplineCurve(outerCtl.map(([r, h]) => new THREE.Vector2(r, h)))
  .getPoints(170).map((p) => [p.x, p.y]);

const at = (h) => {
  if (h <= outer[0][1]) return outer[0][0];
  if (h >= outer[outer.length - 1][1]) return outer[outer.length - 1][0];
  for (let i = 1; i < outer.length; i++) {
    if (outer[i][1] >= h) {
      const [r0, h0] = outer[i - 1], [r1, h1] = outer[i];
      return r0 + (r1 - r0) * ((h - h0) / (h1 - h0));
    }
  }
  return outer[outer.length - 1][0];
};
const wallAt = (h) => (h >= 100 ? 3.0 : h <= 20 ? 4.4 : 4.4 - ((h - 20) / 80) * 1.4);
const innerR = (h) => Math.max(0.4, at(h) - wallAt(h));

const FILL = 99;      // Fuellhoehe
const FLOOR = 3.4;    // Innenboden

/* ---------- Glas: eine geschlossene Aussenhaut ----------
   Bewusst KEINE modellierte Innenwand. Jede zusaetzliche brechende Flaeche
   traegt in three.js noch einmal den Hintergrund bei; vier gestapelte Waende
   summieren sich zu einem hellen, flachen Schleier statt durchsichtig zu
   wirken. Das Volumen der Wand uebernimmt stattdessen `thickness`.      */
const glassProfile = [V2(0, 0)];
for (const [r, h] of outer) glassProfile.push(V2(r, h));
glassProfile.push(V2(11.5, 131.2), V2(11.55, 131.9), V2(11.2, 132.35), V2(10.6, 132.5), V2(0, 132.5));

  metalness: 0,
  roughness: 0.105,
  transmission: 1,
  ior: 1.52,
  thickness: mm(3.2),
  /* Absorption muss im Verhaeltnis zur Wandstaerke stehen. Mit einer
     Weglaenge von mehreren Zentimetern passiert bei 3 mm Glas praktisch
     nichts - deshalb liegt sie hier in derselben Groessenordnung.      */
  attenuationColor: new THREE.Color(0xb0b0ad),
  attenuationDistance: mm(2.4),
  specularIntensity: 0.5,
  envMapIntensity: 0.5,

const bottle = new THREE.Mesh(new THREE.LatheGeometry(glassProfile, 128), glassMat);
bottle.name = 'bottle_glass';
bottle.renderOrder = 3;

/* ---------- Sauce ----------

   wird von einer WAAGERECHTEN Ebene abgeschnitten. Dadurch bleibt der

const TOP = 128;
const sauceProfile = [V2(0, FLOOR)];
for (const [r, h] of outer) if (h > FLOOR && h <= TOP) sauceProfile.push(V2(innerR(h), h));
sauceProfile.push(V2(innerR(TOP), TOP), V2(0, TOP));

const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), mm(FILL));

  envMapIntensity: 0.7,
  clippingPlanes: [clipPlane],

const sauce = new THREE.Mesh(new THREE.LatheGeometry(sauceProfile, 128), sauceMat);

const boreMat = new THREE.MeshStandardMaterial({ name: 'spout_bore', color: 0x1a1220, roughness: 0.45 });
const spouts = new THREE.Group();
[0, Math.PI].forEach((a) => {
  const x = Math.cos(a) * mm(11.5), z = Math.sin(a) * mm(11.5);

  bore.rotation.x = -Math.PI / 2;
  bore.position.set(x, mm(140.6), z);
  spouts.add(lip, bore);
});

function labelTexture(renderer) {
  const [vx, vy, vw, vh] = LABEL_VB;
  const H = 1600, s = H / vh, W = Math.round(vw * s);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.setTransform(s, 0, 0, s, -vx * s, -vy * s);
  for (const p of LABEL_PATHS) { g.fillStyle = p.fill; g.fill(new Path2D(p.d)); }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function decalGeometry(h0, h1, halfWidth, lift = 1.1, segX = 72, segY = 90) {
  const pos = [], uvs = [], idx = [];
  for (let j = 0; j <= segY; j++) {
    const t = j / segY, h = h0 + (h1 - h0) * t, r = at(h) + lift, half = halfWidth / r;
    for (let i = 0; i <= segX; i++) {
      const u = i / segX, a = -half + 2 * half * u;
      pos.push(Math.sin(a) * mm(r), mm(h), Math.cos(a) * mm(r));
      uvs.push(u, t);
    }
  }
  const row = segX + 1;
  for (let j = 0; j < segY; j++) for (let i = 0; i < segX; i++) {
    const v00 = j * row + i, v10 = v00 + 1, v01 = v00 + row, v11 = v01 + 1;
    idx.push(v00, v10, v11, v00, v11, v01);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

/* dunkles Studio: kompakte Lichter, dunkler Grund. Damit bleibt das, was
   man durch das Glas sieht, dunkel wie die Seite dahinter.            */
function studio() {
  const W = 1024, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2a2a27'); g.addColorStop(0.45, '#1b1b19');
  g.addColorStop(0.55, '#151514'); g.addColorStop(1, '#0a0a09');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const soft = (cx, cy, rx, ry, peak, mid) => {
    const r = x.createRadialGradient(0, 0, 0, 0, 0, 1);
    r.addColorStop(0, 'rgba(255,255,255,' + peak + ')');
    r.addColorStop(mid, 'rgba(255,255,255,' + peak * 0.28 + ')');
    r.addColorStop(1, 'rgba(255,255,255,0)');
    const blob = (p) => { x.save(); x.translate(p, cy); x.scale(rx, ry); x.fillStyle = r;
      x.beginPath(); x.arc(0, 0, 1, 0, Math.PI * 2); x.fill(); x.restore(); };
    blob(cx); if (cx - rx < 0) blob(cx + W); if (cx + rx > W) blob(cx - W);
  };
  x.globalCompositeOperation = 'lighter';
  soft(W * 0.26, H * 0.20, W * 0.20, H * 0.24, 0.40, 0.45);
  soft(W * 0.74, H * 0.30, W * 0.15, H * 0.18, 0.24, 0.45);
  soft(W * 0.02, H * 0.44, W * 0.10, H * 0.34, 0.28, 0.4);
  soft(W * 0.54, H * 0.44, W * 0.10, H * 0.34, 0.26, 0.4);
  x.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
}
studio();

const key = new THREE.DirectionalLight(0xfff4e6, 1.0);
key.position.set(-0.22, 0.36, 0.28);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.7);
rim.position.set(0.28, 0.12, -0.34);
scene.add(key, rim, new THREE.AmbientLight(0xffffff, 0.12));

const labelMat = new THREE.MeshStandardMaterial({
  name: 'label_cream',
  color: 0xffffff,
  map: labelTexture(renderer),
  transparent: true,
  roughness: 0.85,
  metalness: 0,
  envMapIntensity: 0.2,
});
const LABEL_BOTTOM = 24, LABEL_TOP = 75;
const LABEL_W = (LABEL_TOP - LABEL_BOTTOM) * (LABEL_VB[2] / LABEL_VB[3]);
const labels = new THREE.Group();
labels.rotation.y = Math.atan2(1, 1.25);
['front', 'back'].forEach((side, i) => {
  const m = new THREE.Mesh(decalGeometry(LABEL_BOTTOM, LABEL_TOP, LABEL_W / 2), labelMat);
  m.name = 'label_' + side;
  m.rotation.y = i * Math.PI;
  m.renderOrder = 4;
  labels.add(m);
});

/* ---------- Spiegel der Fluessigkeit ----------
   Der Schnitt einer waagerechten Ebene durch die geneigte Flasche ist eine
   Ellipse, deren Rand der Flaschenkontur folgt. Fuer jeden Winkel wird die
   Hoehe gesucht, an der die Innenwand die Ebene trifft.                  */
const SEG = 160;
const surfGeo = new THREE.BufferGeometry();
const surfPos = new Float32Array((SEG + 2) * 3);
surfGeo.setAttribute('position', new THREE.BufferAttribute(surfPos, 3));
const surfIdx = [];
for (let i = 0; i < SEG; i++) surfIdx.push(0, i + 1, i + 2);
surfGeo.setIndex(surfIdx);

const surfMat = new THREE.MeshPhysicalMaterial({
  name: 'sauce_surface',
  color: 0x5c2810,
  roughness: 0.18,
  metalness: 0,
  clearcoat: 0.5,
  clearcoatRoughness: 0.14,
  envMapIntensity: 0.5,
  side: THREE.DoubleSide,
});
const surface = new THREE.Mesh(surfGeo, surfMat);

/* Die Flasche kippt um ihre Mitte, nicht um den Boden - sonst wandert sie
   beim Neigen aus dem Bild. */
const PIVOT = 70;

function updateSurface(T) {
  const tan = Math.tan(T);
  const Sw = PIVOT + Math.cos(T) * (FILL - PIVOT);   // Spiegelhoehe in Weltkoordinaten (mm)
  surfPos[0] = 0; surfPos[1] = mm(FILL); surfPos[2] = 0;
  for (let i = 0; i <= SEG; i++) {
    const a = (i / SEG) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    let hm = FILL;
    for (let k = 0; k < 6; k++) hm = FILL - tan * innerR(hm) * ca;
    hm = Math.min(TOP - 0.5, Math.max(FLOOR + 0.2, hm));
    const r = innerR(hm), o = (i + 1) * 3;
    surfPos[o] = mm(r * ca); surfPos[o + 1] = mm(hm); surfPos[o + 2] = mm(r * sa);
  }
  surfGeo.attributes.position.needsUpdate = true;
  surfGeo.computeVertexNormals();
  clipPlane.constant = mm(Sw);
}

/* Flasche dreht sich um ihre eigene Achse, die Neigung liegt eine Ebene
   darueber - so bleibt der Spiegel von der Drehung unberuehrt. */
const spin = new THREE.Group();
spin.add(sauce, bottle, cap, spouts, labels);
const model = new THREE.Group();
model.position.y = mm(PIVOT);
spin.position.y = -mm(PIVOT);
surface.position.y = -mm(PIVOT);
model.add(spin, surface);
scene.add(model);

const TILT_BASE = THREE.MathUtils.degToRad(30);
const TILT_HOVER = THREE.MathUtils.degToRad(6);
let tilt = TILT_BASE, tiltTarget = TILT_BASE;
model.rotation.z = tilt;
updateSurface(tilt);

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

let autoSpin = true, dragging = false;
const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (autoSpin && !dragging) spin.rotation.y += dt * 0.55;
  if (Math.abs(tiltTarget - tilt) > 0.0002) {
    tilt += (tiltTarget - tilt) * Math.min(1, dt * 7);
    model.rotation.z = tilt;
    updateSurface(tilt);
  }
  renderer.render(scene, camera);
})();

/* ---------- Hover ---------- */
/* Hover richtet die Flasche auf und haelt die Eigendrehung an, damit man
   sie selbst in der Hand hat. Ziehen dreht um die Achse, hoch/runter kippt.
   Beim Verlassen faehrt alles in die Ausgangslage zurueck.              */
const TILT_MIN = THREE.MathUtils.degToRad(-8);
const TILT_MAX = THREE.MathUtils.degToRad(62);
const stage = document.getElementById('stage');
let px = 0, py = 0;

const grow = () => { host.style.transform = 'scale(1.08)'; tiltTarget = TILT_HOVER; autoSpin = false; };
const shrink = () => {
  host.style.transform = 'scale(1)';
  tiltTarget = TILT_BASE;
  autoSpin = true;
  dragging = false;
  host.classList.remove('dragging');
};
stage.addEventListener('mouseenter', grow);
stage.addEventListener('mouseleave', shrink);

stage.addEventListener('pointerdown', (e) => {
  dragging = true; px = e.clientX; py = e.clientY;
  host.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  spin.rotation.y += (e.clientX - px) * 0.007;
  tiltTarget = Math.min(TILT_MAX, Math.max(TILT_MIN, tiltTarget + (e.clientY - py) * 0.004));
  px = e.clientX; py = e.clientY;
});
const endDrag = (e) => {
  if (!dragging) return;
  dragging = false;
  host.classList.remove('dragging');
  if (e && e.pointerId != null && stage.hasPointerCapture(e.pointerId)) stage.releasePointerCapture(e.pointerId);
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
</script>
